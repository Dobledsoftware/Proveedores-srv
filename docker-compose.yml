version: '3.8'

services:
  app:
    build: .
    container_name: proveedores-srv
    ports:
      - "8090:8090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/proveedores_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db
    networks:
      - proveedores-net

  db:
    image: postgres:15-alpine
    container_name: proveedores-db
    environment:
      - POSTGRES_DB=proveedores_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proveedores-net

networks:
  proveedores-net:
    driver: bridge

volumes:
  postgres_data:
